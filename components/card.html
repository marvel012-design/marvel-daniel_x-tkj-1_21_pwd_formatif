<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2.1</title>

    <style>

        /* 
        Perhitungan lebar tanpa box-sizing:
        320px + 40px padding + 4px border = 364px
        */

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Selector Tag */
        body {
            margin: 0;
            background-color: #000000;
            font-family: Arial, sans-serif;
        }

        main {
            padding: 20px;
        }

        /* Selector Class */
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #000000;
            margin: 30px auto;
            background-color: rgb(255, 251, 251);
            border-radius: 10px;
        }

        /* Descendant Selector */
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        .card h3 {
            color: #006eff;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            color: #ff0000;
            line-height: 1.6;
        }

        .card a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .card a:hover {
            color: #ff0000;
        }

        footer {
            text-align: center;
            padding: 15px;
        }

        footer a {
            color: purple;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <main>

        <!-- 2.1 -->
        <div class="card">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQE9LQd2EDKdFBc-vRYy_vq-4Z3wyrh0IEWqZ3ORryMkA&s=10"
            >

            <h3>El Gasing</h3>

            <p>
                Ini adalah proyek pembuatan 1922 untuk merencanakan pembobolan struktur keamanan sekolah SMK negeri 10 pontianak.
            </p>

            <a href="#">Look the proyek</a>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <a href="/3.1.html">Back to Home</a>
    </footer>

</body>
</html>
