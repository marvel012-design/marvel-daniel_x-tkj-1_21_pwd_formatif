<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kumpulan Tombol</title>

    <style>

        /* Selector tag */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            padding: 40px;
        }

        h3 {
            color: #1e3a5f;
        }

        /* Selector class */
        .button-container {
            margin-bottom: 25px;
        }

        /* Grouping selector */
        button, a {
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        /* Tombol utama */
        .btn {
            border: none;
            padding: 10px 18px;
            margin-right: 8px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        /* Descendant selector */
        .button-container button {
            font-weight: bold;
        }

        /* Tombol Lihat Proyek */
        .proyek {
            background-color: #1e3a5f;
        }

        /* Tombol Unduh CV */
        .cv {
            background-color: #94a3b8;
        }

        /* Tombol Hubungi Saya */
        .hubungi {
            background-color: #64748b;
        }

        /* Tombol Kirim Pesan */
        .pesan {
            background-color: #f59e0b;
        }

        /* Pseudo-class hover */
        .proyek:hover {
            background-color: #0f172a;
        }

        .cv:hover {
            background-color: #64748b;
        }

        .hubungi:hover {
            background-color: #334155;
        }

        .pesan:hover {
            background-color: #d97706;
        }

        /* Link kembali */
        .kembali {
            color: purple;
            font-size: 13px;
        }

        .kembali:hover {
            color: blue;
        }

    </style>
</head>

<body>

    <h3>Normal</h3>

    <div class="button-container">

        <button class="btn proyek">
            Lihat Proyek
        </button>

        <button class="btn cv">
            Unduh CV
        </button>

        <button class="btn hubungi">
            Hubungi Saya
        </button>

        <button class="btn pesan">
            Kirim Pesan
        </button>

    </div>


    <h3>Hover (arahkan mouse ke tombol)</h3>

    <div class="button-container">

        <button class="btn proyek">
            Lihat Proyek
        </button>

        <button class="btn cv">
            Unduh CV
        </button>

        <button class="btn hubungi">
            Hubungi Saya
        </button>

        <button class="btn pesan">
            Kirim Pesan
        </button>

    </div>


    <br>

    <a href="/index.html">Go to Home</a>

</body>
</html>
