    <style>
        body {
    background-color: #f4f6f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
}
 
main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 600px;
    width: 100%;
    padding: 20px;
}
 
img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
}
 
h1 {
    color: navy;
    font-size: 40px;
    font-weight: bold;
    font-family: Georgia, serif;
    text-align: center;
    margin: 0 0 10px 0;
}
 
h2 {
    color: rgb(184, 115, 51);
    font-size: 24px;
    font-weight: normal;
    font-family: Georgia, serif;
    text-align: center;
    margin: 0 0 25px 0;
    border-bottom: 2px solid rgb(184, 115, 51);
    padding-bottom: 8px;
}
 
div {
    background-color: rgba(220, 226, 235, 0.7);
    padding: 20px 25px;
    border-radius: 12px;
    margin-bottom: 30px;
}
 
p {
    color: #333333;
    font-size: 16px;
    font-family: Arial, sans-serif;
    text-align: left;
    line-height: 1.6;
    margin: 0 0 15px 0;
}
 
p:last-child {
    margin-bottom: 0;
}
 
footer {
    text-align: center;
}
 
footer a {
    color: #0056b3;
    font-size: 14px;
    font-family: Arial, sans-serif;
    text-decoration: underline;
}
    </style>
</head>
